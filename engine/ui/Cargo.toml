[package]
name = "c3-ui"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
c3-core = { version = "0.1.0", path = "../core" }
c3-game = { version = "0.1.0", path = "../game" }
c3-scene = { version = "0.1.0", path = "../scene" }
# `icons::install` builds on egui's bundled fonts (eframe turns them on; other hosts may not).
egui = { version = "0.37.0", features = ["default_fonts"] }
c3-script = { version = "0.1.0", path = "../script" }
