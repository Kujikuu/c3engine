[package]
name = "c3-play"
version.workspace = true
edition.workspace = true

[dependencies]
c3-anim = { version = "0.1.0", path = "../anim" }
c3-assets = { version = "0.1.0", path = "../assets" }
c3-core = { version = "0.1.0", path = "../core" }
c3-audio = { version = "0.1.0", path = "../audio" }
c3-data = { version = "0.1.0", path = "../data" }
c3-formats-gltf = { version = "0.1.0", path = "../../formats/gltf" }
c3-game = { version = "0.1.0", path = "../game" }
c3-online = { version = "0.1.0", path = "../online" }
c3-project = { version = "0.1.0", path = "../project" }
c3-render = { version = "0.1.0", path = "../render" }
c3-scene = { version = "0.1.0", path = "../scene" }
c3-script = { version = "0.1.0", path = "../script" }
c3-ui = { version = "0.1.0", path = "../ui" }
dirs = "7.0.0"
egui = "0.37.0"
gilrs = "0.11.2"
glam = "0.34.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
