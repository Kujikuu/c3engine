// Conquer 5065's dialogs as the client builds them in code: each control's kind, its
// Control.Ani section, what it shows and what a click does. GUI.ini places them; controls it
// doesn't place carry their own x/y. Drawing order is the client's Show() order.

// ---- The main bar (CDlgMain, IDD_MAIN_DIALOG 130; DlgMain.cpp OnInitDialog / Show) ----
